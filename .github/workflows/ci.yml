name: SoroHub CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build
        env:
          # If you have public env variables needed for the build, define them here.
          # E.g. NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_TELEMETRY_DISABLED: 1

  build-contracts:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contracts

      - name: Build Escrow Contract
        working-directory: ./contracts/escrow
        run: cargo build --target wasm32v1-none --release

      - name: Run Escrow Tests
        working-directory: ./contracts/escrow
        run: cargo test

      - name: Build Badge Contract
        working-directory: ./contracts/badge
        run: cargo build --target wasm32v1-none --release

      - name: Run Badge Tests
        working-directory: ./contracts/badge
        run: cargo test

  deploy-frontend:
    name: Deploy Next.js to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-contracts:
    name: Deploy Contracts to Soroban Testnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config build-essential libssl-dev libudev-dev

      - name: Install Stellar CLI
        run: cargo install stellar-cli

      - name: Build and Optimize Escrow
        working-directory: ./contracts/escrow
        run: |
          cargo build --target wasm32v1-none --release
          stellar contract optimize --wasm target/wasm32v1-none/release/escrow_contract.wasm

      - name: Build and Optimize Badge
        working-directory: ./contracts/badge
        run: |
          cargo build --target wasm32v1-none --release
          stellar contract optimize --wasm target/wasm32v1-none/release/badge_contract.wasm

      - name: Deploy Contracts
        env:
          STELLAR_DEPLOYER_SECRET: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          if [ -z "$STELLAR_DEPLOYER_SECRET" ]; then
            echo "Skipping contract deployment because STELLAR_DEPLOYER_SECRET is not set."
            exit 0
          fi
          
          stellar keys add deployer --secret-key $STELLAR_DEPLOYER_SECRET
          
          # Deploy Escrow
          echo "Deploying Escrow Contract..."
          stellar contract deploy \
            --wasm ./contracts/escrow/target/wasm32v1-none/release/escrow_contract.optimized.wasm \
            --source deployer \
            --network testnet
            
          # Deploy Badge
          echo "Deploying Badge Contract..."
          stellar contract deploy \
            --wasm ./contracts/badge/target/wasm32v1-none/release/badge_contract.optimized.wasm \
            --source deployer \
            --network testnet
